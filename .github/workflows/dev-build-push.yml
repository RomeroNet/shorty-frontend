name: Build and push dev images

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  USER: romeronet
  REPOSITORY: shorty-frontend

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up BuildX
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USER }}/${{ env.REPOSITORY }}/web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up kubectl
          uses: azure/setup-kubectl@v4

        - name: Set up helm
          uses: azure/setup-helm@v4

        - name: Set up kubeconfig
          run: mkdir -p ~/.kube && echo "${{ secrets.KUBECTL_CONTENT }}" > ~/.kube/config

        - name: Deploy to Kubernetes
          run: |
            helm upgrade --install -n shorty-dev shorty-frontend helm \
              --set sha=${{ github.sha }}